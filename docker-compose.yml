services:
  auth-service:
    image: chiefj/llm-obs-auth:latest
    build:
      context: ..
      dockerfile: auth/Dockerfile
    container_name: observability-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - USE_REAL_DB=true
      - DATABASE_URL=postgresql://postgres:postgres@auth-db:5432/observability_auth
      - REDIS_URL=redis://:llmobs_redis_s3cret_2024@llmobs-redis-ledger:6379
      - KAFKA_BROKERS=llmobs-kafka-broker:9092
      - JWT_SECRET=super-secure-production-auth-jwt-secret-key-replace-in-env-file-minimum-32-chars!
      - SERVICE_REGISTRY_URL=http://llmobs-service-registry:31426
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  auth-db:
    image: google/alloydbomni:latest
    container_name: auth-service-db
    shm_size: '1gb'
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "31412:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=observability_auth
      - ALLOYDB_ENABLE_COLUMNAR_ENGINE=false
    command: >
      postgres
      -c shared_buffers=256MB
      -c google_columnar_engine.enabled=off
      -c google_ml_integration.enabled=off
      -c google_db_advisor.enabled=off
      -c google_storage.replay_prefetcher_enabled=off
      -c max_connections=100
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - default

volumes:
  auth_db_data:

networks:
  default:
    name: llmobs-network
    external: true

