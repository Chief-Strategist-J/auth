services:
  auth-service:
    build:
      context: ..
      dockerfile: auth/Dockerfile.dev
    container_name: observability-auth-service
    ports:
      - "3001:3001"
    volumes:
      - ..:/app/packages/node
      - /app/packages/node/auth/node_modules
      - /app/packages/node/shared-infra/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - USE_REAL_DB=true
      - DATABASE_URL=postgresql://postgres:postgres@auth-db:5432/observability_auth
      - REDIS_URL=redis://:llmobs_redis_s3cret_2024@localhost:31413
      - KAFKA_BROKERS=localhost:31414
      - JWT_SECRET=dev-secret-key-change-in-production
      - SERVICE_REGISTRY_URL=http://llmobs-service-registry:31426
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  auth-db:
    image: google/alloydbomni:latest
    container_name: auth-service-db
    shm_size: '1gb'
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "31412:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=observability_auth
      - ALLOYDB_ENABLE_COLUMNAR_ENGINE=false
    command: >
      postgres
      -c shared_buffers=256MB
      -c google_columnar_engine.enabled=off
      -c google_ml_integration.enabled=off
      -c google_db_advisor.enabled=off
      -c google_storage.replay_prefetcher_enabled=off
      -c max_connections=100
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - default

volumes:
  auth_db_data:

networks:
  default:
    name: llmobs-network
    external: true

